aid: xapo
name: Xapo
description: >-
  Xapo Bank is a members-only private bank and Bitcoin custodian founded in
  2013, combining regulated fiat banking with institutional-grade Bitcoin
  custody in a single app. Members earn interest on Bitcoin and USD balances,
  borrow against Bitcoin without selling, invest in US stocks and ETFs, and
  transact globally in multiple currencies. Xapo Bank Limited is regulated by
  the Gibraltar Financial Services Commission as a credit institution
  (Permission No. 23171), with Xapo VASP Limited licensed as a DLT Provider
  (Permission No. 26061). The company publishes SOC 2 Type II / SOC 3, PCI DSS,
  and GDPR compliance claims but operates app-only today, with no public
  developer API or portal; legacy Xapo Bitcoin API SDKs remain on PyPI and
  RubyGems from its pre-bank wallet era.
